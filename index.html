<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RuralBiz | Retail & Wholesale</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#182235;--muted:#6b778c;--primary:#1769e0;--border:#e1e6ef;--green:#16803c;--red:#c32626;--yellow:#9b7200}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{height:64px;background:#12233b;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:5}
.brand{font-weight:900;font-size:21px}.header-right{display:flex;gap:8px;align-items:center}.pill{font-size:12px;background:#e9f1ff;color:#123b79;padding:7px 10px;border-radius:18px;font-weight:800}
nav{background:#fff;border-bottom:1px solid var(--border);display:flex;gap:7px;padding:10px;overflow:auto;position:sticky;top:64px;z-index:4}
nav button{border:0;background:#edf1f7;color:#25344c;padding:10px 13px;border-radius:9px;font-weight:800;white-space:nowrap;cursor:pointer}
nav button.active{background:var(--primary);color:#fff}
main{max-width:1180px;margin:auto;padding:18px}.section{display:none}.section.active{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:13px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:0 2px 8px #00000008}
.stat{font-size:27px;font-weight:900;margin-top:5px}.muted{color:var(--muted);font-size:13px}.green{color:var(--green)}.red{color:var(--red)}.yellow{color:var(--yellow)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.gap{gap:9px}
button{cursor:pointer}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:800}.primary{background:var(--primary);color:#fff}.secondary{background:#eaf0f7;color:#20324d}.danger{background:#ffe4e4;color:#9b1c1c}.success{background:#e4f7eb;color:#126d34}
input,select{width:100%;padding:11px;border:1px solid #cbd4e1;border-radius:9px;background:#fff}.form{display:grid;gap:9px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--border);text-align:left;font-size:13px;vertical-align:top}th{color:var(--muted);font-size:12px}
.table-wrap{overflow:auto}.tag{display:inline-block;padding:4px 7px;border-radius:12px;font-size:11px;font-weight:800;background:#edf3ff;color:#1769e0}.tag.green{background:#e5f7eb}.tag.red{background:#ffe6e6}.tag.yellow{background:#fff5d5}
.notice{padding:12px;border-left:4px solid #e1b300;background:#fff8dd;border-radius:8px;margin-bottom:14px}.empty{text-align:center;color:var(--muted);padding:25px}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.open{display:flex}.modalbox{background:#fff;border-radius:15px;padding:18px;max-width:600px;width:100%;max-height:90vh;overflow:auto}
.product-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.product h3{margin:8px 0}.price{font-size:19px;font-weight:900}
.qty{display:flex;align-items:center;gap:8px}.qty button{border:0;background:#e8eef7;border-radius:7px;width:31px;height:31px;font-weight:900}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.login .card{max-width:420px;width:100%}
@media(max-width:650px){main{padding:11px}.stat{font-size:23px}header{height:58px}nav{top:58px}th,td{font-size:12px;padding:8px}}
</style>
</head>
<body>
<div id="login" class="login">
 <div class="card">
  <h1 style="margin-top:0">RuralBiz</h1>
  <p class="muted">B2B ordering + wholesaler/supplier inventory + digital khata</p>
  <div class="form">
   <label>Demo role</label>
   <select id="loginRole"><option value="retailer">Retailer</option><option value="wholesaler">Wholesaler</option><option value="supplier">Supplier</option><option value="admin">Admin</option></select>
   <input id="loginName" placeholder="Your name / shop name" value="Demo User">
   <button class="btn primary" onclick="login()">Open Dashboard</button>
  </div>
  <p class="muted" style="margin-bottom:0">This usable MVP stores data locally in this browser. It is not yet a production cloud system.</p>
 </div>
</div>

<div id="app" style="display:none">
<header><div class="brand">RuralBiz</div><div class="header-right"><span id="userPill" class="pill"></span><button class="btn secondary" onclick="logout()">Logout</button></div></header>
<nav id="nav"></nav>
<main>
<section id="dashboard" class="section active"></section>
<section id="products" class="section"></section>
<section id="orders" class="section"></section>
<section id="inventory" class="section"></section>
<section id="khata" class="section"></section>
<section id="partners" class="section"></section>
<section id="settings" class="section"></section>
</main>
</div>

<div id="modal" class="modal"><div class="modalbox" id="modalContent"></div></div>

<script>
const KEY='ruralbiz_v2';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{
 products:[
  {id:'p1',name:'Rice 25 kg',sku:'RICE25',price:1150,stock:100,low:15,active:true},
  {id:'p2',name:'Wheat Flour 10 kg',sku:'FLOUR10',price:520,stock:60,low:10,active:true},
  {id:'p3',name:'Cooking Oil 5 L',sku:'OIL5',price:760,stock:30,low:8,active:true},
  {id:'p4',name:'Sugar 25 kg',sku:'SUGAR25',price:1050,stock:25,low:5,active:true}
 ],
 orders:[], ledger:[], stockLog:[], users:[
  {id:'r1',name:'Demo Retail Shop',role:'retailer'},
  {id:'w1',name:'Demo Wholesale',role:'wholesaler'},
  {id:'s1',name:'Demo Supplier',role:'supplier'}
 ], session:null
};
let cart={};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function money(n){return '₹'+Math.round(Number(n)||0).toLocaleString('en-IN')}
function now(){return new Date().toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}
function uid(p){return p+Math.random().toString(36).slice(2,9)}
function role(){return db.session?.role}
function userName(){return db.session?.name||''}
function login(){db.session={role:document.getElementById('loginRole').value,name:document.getElementById('loginName').value||'User'};save();boot()}
function logout(){db.session=null;save();location.reload()}
function boot(){if(!db.session)return;document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('userPill').textContent=userName()+' · '+role().toUpperCase();buildNav();render()}
function buildNav(){
 let items=role()==='retailer'?[['dashboard','Dashboard'],['products','Products'],['orders','My Orders'],['khata','My Khata']]:
 role()==='supplier'?[['dashboard','Dashboard'],['inventory','Inventory'],['orders','Dispatches'],['partners','Wholesalers']]:
 role()==='wholesaler'?[['dashboard','Dashboard'],['products','Products'],['orders','Orders'],['inventory','Inventory'],['khata','Khata'],['partners','Retailers']]:
 [['dashboard','Dashboard'],['products','Products'],['orders','Orders'],['inventory','Inventory'],['khata','Khata'],['partners','Users'],['settings','Settings']];
document.getElementById('nav').innerHTML=items.map((x,i)=>`<button class="${i===0?'active':''}" onclick="show('${x[0]}',this)">${x[1]}</button>`).join('')
}
function show(id,btn){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));btn?.classList.add('active');renderSection(id)}
function render(){document.querySelectorAll('.section.active').forEach(s=>renderSection(s.id))}
function renderSection(id){
 if(id==='dashboard')dashboard(); if(id==='products')productsPage(); if(id==='orders')ordersPage();
 if(id==='inventory')inventoryPage(); if(id==='khata')khataPage(); if(id==='partners')partnersPage(); if(id==='settings')settingsPage()
}
function dashboard(){
let total=db.orders.reduce((s,o)=>s+o.amount,0), due=balance(), low=db.products.filter(p=>p.stock<=p.low).length;
document.getElementById('dashboard').innerHTML=`<h2>Dashboard</h2><div class="notice">Payment gateway is intentionally disabled. This app records <b>paid / due / balance</b> only.</div>
<div class="grid">
<div class="card"><div class="muted">Orders</div><div class="stat">${db.orders.length}</div></div>
<div class="card"><div class="muted">Order Value</div><div class="stat">${money(total)}</div></div>
<div class="card"><div class="muted">Outstanding</div><div class="stat red">${money(due)}</div></div>
<div class="card"><div class="muted">Low Stock</div><div class="stat yellow">${low}</div></div></div>
<div class="card" style="margin-top:14px"><h3>Quick actions</h3><div class="row wrap gap">
${role()==='retailer'?'<button class="btn primary" onclick="quickShow(\'products\')">Place Order</button>':''}
${['wholesaler','supplier','admin'].includes(role())?'<button class="btn primary" onclick="quickShow(\'inventory\')">Manage Inventory</button>':''}
${['wholesaler','admin'].includes(role())?'<button class="btn secondary" onclick="quickShow(\'khata\')">Open Khata</button>':''}
</div></div>`
}
function quickShow(id){let b=[...document.querySelectorAll('nav button')].find(x=>x.textContent.toLowerCase().includes(id==='products'?'products':id==='inventory'?'inventory':'khata'));show(id,b)}
function productsPage(){
let q='';document.getElementById('products').innerHTML=`<div class="row wrap"><h2>Products</h2><input id="prodSearch" style="max-width:300px" placeholder="Search..." oninput="renderProductCards()"></div><div id="productCards" class="product-grid"></div><div class="card" style="margin-top:14px"><div class="row"><b>Cart total</b><b id="cartTotal">${money(cartTotal())}</b></div><button class="btn primary" style="margin-top:10px" onclick="placeOrder()">Place Order</button></div>`;renderProductCards()
}
function renderProductCards(){let q=(document.getElementById('prodSearch')?.value||'').toLowerCase();let arr=db.products.filter(p=>p.active&&p.name.toLowerCase().includes(q));document.getElementById('productCards').innerHTML=arr.map(p=>`<div class="card product"><span class="tag ${p.stock<=p.low?'yellow':''}">${p.stock<=p.low?'Low stock':'In stock'} · ${p.stock}</span><h3>${p.name}</h3><div class="muted">SKU ${p.sku}</div><div class="price">${money(p.price)}</div><div class="qty" style="margin-top:12px"><button onclick="changeCart('${p.id}',-1)">−</button><b>${cart[p.id]||0}</b><button onclick="changeCart('${p.id}',1)">+</button></div></div>`).join('')||'<div class="empty">No products</div>';if(document.getElementById('cartTotal'))document.getElementById('cartTotal').textContent=money(cartTotal())}
function changeCart(id,d){let p=db.products.find(x=>x.id===id);cart[id]=Math.max(0,Math.min(p.stock,(cart[id]||0)+d));renderProductCards()}
function cartTotal(){return Object.entries(cart).reduce((s,[id,q])=>s+db.products.find(p=>p.id===id).price*q,0)}
function placeOrder(){let items=Object.entries(cart).filter(([_,q])=>q);if(!items.length)return alert('Cart is empty');let total=cartTotal();let o={id:uid('ORD-'),date:now(),retailer:userName(),amount:total,status:'Pending',items:items.map(([id,q])=>({productId:id,qty:q,price:db.products.find(p=>p.id===id).price}))};db.orders.push(o);ledgerPush(total,'Purchase / Credit',o.id,userName());cart={};save();alert('Order placed successfully: '+o.id);showByName('orders')}
function showByName(id){let b=[...document.querySelectorAll('nav button')].find(x=>x.textContent.toLowerCase().includes(id));show(id,b)}
function ordersPage(){
let arr=db.orders;document.getElementById('orders').innerHTML=`<h2>Orders</h2><div class="card table-wrap"><table><thead><tr><th>Order</th><th>Retailer</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead><tbody>${arr.length?arr.map(o=>`<tr><td>${o.id}<br><span class="muted">${o.date}</span></td><td>${o.retailer}</td><td>${money(o.amount)}</td><td><span class="tag">${o.status}</span></td><td>${role()==='wholesaler'&&o.status==='Pending'?`<button class="btn success" onclick="confirmOrder('${o.id}')">Confirm</button> <button class="btn danger" onclick="rejectOrder('${o.id}')">Reject</button>`:`<button class="btn secondary" onclick="orderDetails('${o.id}')">View</button>`}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">No orders yet</td></tr>'}</tbody></table></div>`
}
function confirmOrder(id){let o=db.orders.find(x=>x.id===id);if(!o)return;for(let it of o.items){let p=db.products.find(x=>x.id===it.productId);if(it.qty>p.stock)return alert('Insufficient stock for '+p.name)}for(let it of o.items){let p=db.products.find(x=>x.id===it.productId);adjustStock(p.id,-it.qty,'Retailer order '+o.id)}o.status='Confirmed';save();renderSection('orders');alert('Order confirmed. Inventory reduced automatically.')}
function rejectOrder(id){let o=db.orders.find(x=>x.id===id);o.status='Rejected';save();renderSection('orders')}
function orderDetails(id){let o=db.orders.find(x=>x.id===id);openModal(`<h3>${o.id}</h3><p>${o.retailer} · ${o.date}</p>${o.items.map(i=>{let p=db.products.find(x=>x.id===i.productId);return `<div class="row"><span>${p?.name||'Product'} × ${i.qty}</span><b>${money(i.price*i.qty)}</b></div>`}).join('<hr>')}<hr><div class="row"><b>Total</b><b>${money(o.amount)}</b></div><button class="btn secondary" onclick="closeModal()" style="margin-top:12px">Close</button>`)}
function inventoryPage(){
let canEdit=['wholesaler','supplier','admin'].includes(role());document.getElementById('inventory').innerHTML=`<div class="row wrap"><h2>Inventory</h2>${canEdit?'<button class="btn primary" onclick="openProductForm()">+ Add Product</button>':''}</div>
<div class="card table-wrap"><table><thead><tr><th>Product</th><th>SKU</th><th>Stock</th><th>Price</th><th>Status</th><th>Manual</th></tr></thead><tbody>${db.products.map(p=>`<tr><td><b>${p.name}</b></td><td>${p.sku}</td><td><b>${p.stock}</b></td><td>${money(p.price)}</td><td>${p.stock===0?'<span class="tag red">Out</span>':p.stock<=p.low?'<span class="tag yellow">Low</span>':'<span class="tag green">OK</span>'}</td><td>${canEdit?`<button class="btn success" onclick="stockModal('${p.id}',1)">+ Stock</button> <button class="btn danger" onclick="stockModal('${p.id}',-1)">− Stock</button> <button class="btn secondary" onclick="editProduct('${p.id}')">Edit</button>`:'View only'}</td></tr>`).join('')}</tbody></table></div>
<div class="card" style="margin-top:14px"><h3>Stock History</h3><div class="table-wrap"><table><thead><tr><th>Date</th><th>Product</th><th>Change</th><th>Reason</th></tr></thead><tbody>${db.stockLog.slice().reverse().slice(0,50).map(x=>`<tr><td>${x.date}</td><td>${x.product}</td><td class="${x.change>=0?'green':'red'}">${x.change>0?'+':''}${x.change}</td><td>${x.reason}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No stock movements</td></tr>'}</tbody></table></div></div>`
}
function openProductForm(p={}){openModal(`<h3>${p.id?'Edit':'Add'} Product</h3><div class="form"><input id="fName" placeholder="Product name" value="${p.name||''}"><input id="fSku" placeholder="SKU" value="${p.sku||''}"><input id="fPrice" type="number" placeholder="Price" value="${p.price||''}"><input id="fStock" type="number" placeholder="Opening stock" value="${p.stock??''}"><input id="fLow" type="number" placeholder="Low-stock alert at" value="${p.low??10}"><button class="btn primary" onclick="saveProduct('${p.id||''}')">Save</button><button class="btn secondary" onclick="closeModal()">Cancel</button></div>`)}
function saveProduct(id){let name=document.getElementById('fName').value.trim(),sku=document.getElementById('fSku').value.trim(),price=Number(document.getElementById('fPrice').value),stock=Number(document.getElementById('fStock').value),low=Number(document.getElementById('fLow').value);if(!name||!sku||price<0||stock<0)return alert('Fill valid product details');if(id){let p=db.products.find(x=>x.id===id),old=p.stock;p.name=name;p.sku=sku;p.price=price;p.stock=stock;p.low=low;if(stock!==old)logStock(p,stock-old,'Manual stock edit')}else{let p={id:uid('p'),name,sku,price,stock,low,active:true};db.products.push(p);if(stock)logStock(p,stock,'Opening stock')}save();closeModal();renderSection('inventory')}
function editProduct(id){openProductForm(db.products.find(p=>p.id===id))}
function stockModal(id,dir){let p=db.products.find(x=>x.id===id);openModal(`<h3>${dir>0?'Add':'Remove'} Stock — ${p.name}</h3><div class="form"><input id="stockAmt" type="number" min="1" placeholder="Quantity"><input id="stockReason" placeholder="Reason (e.g. Supplier received / damaged)"><button class="btn primary" onclick="applyStock('${id}',${dir})">Update</button><button class="btn secondary" onclick="closeModal()">Cancel</button></div>`)}
function applyStock(id,dir){let n=Number(document.getElementById('stockAmt').value),reason=document.getElementById('stockReason').value||'Manual adjustment';if(!n||n<1)return alert('Enter quantity');let p=db.products.find(x=>x.id===id);if(dir<0&&n>p.stock)return alert('Not enough stock');adjustStock(id,dir*n,reason);save();closeModal();renderSection('inventory')}
function adjustStock(id,change,reason){let p=db.products.find(x=>x.id===id);p.stock+=change;logStock(p,change,reason)}
function logStock(p,change,reason){db.stockLog.push({date:now(),product:p.name,change,reason})}
function khataPage(){
let canPay=role()==='wholesaler'||role()==='admin';let p=totalCredit(),paid=totalPaid(),due=p-paid;
document.getElementById('khata').innerHTML=`<h2>Digital Khata</h2><div class="grid"><div class="card"><div class="muted">Total Credit / Purchases</div><div class="stat">${money(p)}</div></div><div class="card"><div class="muted">Total Paid</div><div class="stat green">${money(paid)}</div></div><div class="card"><div class="muted">Balance Due</div><div class="stat red">${money(due)}</div></div></div>
${canPay?`<div class="card" style="margin-top:14px"><h3>Record payment received</h3><div class="formgrid"><input id="payAmount" type="number" placeholder="Amount"><input id="payNote" placeholder="Cash / UPI / bank / note"><button class="btn primary" onclick="recordPayment()">Add Payment</button></div></div>`:''}
<div class="card" style="margin-top:14px"><h3>Ledger</h3><div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Note</th></tr></thead><tbody>${db.ledger.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${x.type}</td><td class="${x.amount<0?'green':''}">${money(Math.abs(x.amount))}</td><td>${x.note}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No transactions</td></tr>'}</tbody></table></div></div>`
}
function ledgerPush(amount,type,note,by){db.ledger.push({id:uid('L'),date:now(),amount,type,note,by})}
function totalCredit(){return db.ledger.filter(x=>x.amount>0).reduce((s,x)=>s+x.amount,0)}
function totalPaid(){return -db.ledger.filter(x=>x.amount<0).reduce((s,x)=>s+x.amount,0)}
function balance(){return totalCredit()-totalPaid()}
function recordPayment(){let a=Number(document.getElementById('payAmount').value);if(!a||a<=0)return alert('Enter a valid amount');if(a>balance())return alert('Payment cannot exceed outstanding balance');ledgerPush(-a,'Payment Received',document.getElementById('payNote').value||'Payment',userName());save();renderSection('khata');alert('Payment recorded')}
function partnersPage(){let list=db.users.filter(u=>u.role!==role());document.getElementById('partners').innerHTML=`<h2>${role()==='supplier'?'Wholesalers':role()==='wholesaler'?'Retailers':'Users'}</h2><div class="grid">${list.map(u=>`<div class="card"><b>${u.name}</b><div class="muted">${u.role}</div></div>`).join('')||'<div class="empty">No users</div>'}</div>`}
function settingsPage(){document.getElementById('settings').innerHTML=`<h2>Settings</h2><div class="card"><h3>Local data</h3><p class="muted">This MVP uses browser localStorage. Export a backup before clearing data.</p><button class="btn primary" onclick="exportData()">Export backup</button> <button class="btn danger" onclick="clearData()">Clear all demo data</button></div><div class="card" style="margin-top:14px"><h3>Production checklist</h3><ul><li>Real OTP authentication</li><li>Cloud PostgreSQL database</li><li>Server-side role permissions</li><li>Immutable ledger + audit logs</li><li>HTTPS, rate limits and backups</li></ul></div>`}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='ruralbiz-backup.json';a.click()}
function clearData(){if(confirm('Clear all local demo data?')){localStorage.removeItem(KEY);location.reload()}}
function openModal(x){document.getElementById('modalContent').innerHTML=x;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
if(db.session)boot()
</script>
</body>
</html>
