<body>

    <div class="form">

<script>

/* ================================
   RURALBIZ API
================================ */

const API =
  "https://ruralbiz-api-manish-t.onrender.com";


let token =
  localStorage.getItem("ruralbiz_token") || "";

let currentUser =
  JSON.parse(
    localStorage.getItem("ruralbiz_user") || "null"
  );

let productsData = [];
let ordersData = [];
let cart = {};


/* ================================
   BASIC HELPERS
================================ */

function money(value){

  return "₹" +
    Math.round(Number(value) || 0)
    .toLocaleString("en-IN");

}


function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function showError(id,message){

  const el =
    document.getElementById(id);

  if(!el) return;

  el.textContent = message;
  el.style.display = "block";

}


function hideError(id){

  const el =
    document.getElementById(id);

  if(el){

    el.style.display = "none";

  }

}


function saveSession(){

  localStorage.setItem(
    "ruralbiz_token",
    token
  );

  localStorage.setItem(
    "ruralbiz_user",
    JSON.stringify(currentUser)
  );

}


function clearSession(){

  localStorage.removeItem(
    "ruralbiz_token"
  );

  localStorage.removeItem(
    "ruralbiz_user"
  );

  token = "";
  currentUser = null;

}


async function api(path,options={}){

  const headers = {
    "Content-Type":"application/json",
    ...(options.headers || {})
  };

  if(token){

    headers.Authorization =
      "Bearer " + token;

  }

  const response =
    await fetch(API + path,{
      ...options,
      headers
    });

  let data = null;

  try{

    data = await response.json();

  }catch{

    data = {};

  }

  if(!response.ok){

    throw new Error(
      data.error ||
      "Request failed"
    );

  }

  return data;

}


/* ================================
   LOGIN / REGISTER
================================ */

function showRegister(){

  document.getElementById("login")
    .style.display = "none";

  document.getElementById("register")
    .style.display = "flex";

}


function showLogin(){

  document.getElementById("register")
    .style.display = "none";

  document.getElementById("login")
    .style.display = "flex";

}


async function registerUser(){

  hideError("registerError");

  const name =
    document.getElementById("regName")
    .value.trim();

  const phone =
    document.getElementById("regPhone")
    .value.trim();

  const password =
    document.getElementById("regPassword")
    .value;

  const role =
    document.getElementById("regRole")
    .value;

  if(!name || !phone || !password){

    showError(
      "registerError",
      "Please fill all fields."
    );

    return;

  }

  try{

    const data =
      await api(
        "/api/auth/register",
        {
          method:"POST",
          body:JSON.stringify({
            name,
            phone,
            password,
            role
          })
        }
      );

    token = data.token;
    currentUser = data.user;

    saveSession();

    boot();

  }catch(error){

    showError(
      "registerError",
      error.message
    );

  }

}


async function loginUser(){

  hideError("loginError");

  const phone =
    document.getElementById("loginPhone")
    .value.trim();

  const password =
    document.getElementById("loginPassword")
    .value;

  if(!phone || !password){

    showError(
      "loginError",
      "Enter phone and password."
    );

    return;

  }

  try{

    const data =
      await api(
        "/api/auth/login",
        {
          method:"POST",
          body:JSON.stringify({
            phone,
            password
          })
        }
      );

    token = data.token;
    currentUser = data.user;

    saveSession();

    boot();

  }catch(error){

    showError(
      "loginError",
      error.message
    );

  }

}


function logout(){

  clearSession();

  location.reload();

}


/* ================================
   START APP
================================ */

function boot(){

  if(!token || !currentUser){

    document.getElementById("login")
      .style.display = "flex";

    return;

  }

  document.getElementById("login")
    .style.display = "none";

  document.getElementById("register")
    .style.display = "none";

  document.getElementById("app")
    .style.display = "block";

  document.getElementById("userPill")
    .textContent =
      currentUser.name +
      " · " +
      currentUser.role.toUpperCase();

  buildNav();

  renderDashboard();

}


function buildNav(){

  let items = [];

  if(currentUser.role === "retailer"){

    items = [
      ["dashboard","Dashboard"],
      ["products","Products"],
      ["orders","My Orders"],
      ["khata","My Khata"],
      ["partners","Partners"]
    ];

  }

  else if(currentUser.role === "wholesaler"){

    items = [
      ["dashboard","Dashboard"],
      ["products","Products"],
      ["orders","Orders"],
      ["inventory","Inventory"],
      ["khata","Khata"],
      ["partners","Retailers"]
    ];

  }

  else if(currentUser.role === "supplier"){

    items = [
      ["dashboard","Dashboard"],
      ["inventory","Inventory"],
      ["orders","Orders"],
      ["partners","Wholesalers"]
    ];

  }

  document.getElementById("nav")
    .innerHTML =
      items.map(
        (item,index)=>`
          <button
            class="${index===0?"active":""}"
            onclick="showSection('${item[0]}',this)">
            ${item[1]}
          </button>
        `
      ).join("");

}


function showSection(id,button){

  document
    .querySelectorAll(".section")
    .forEach(
      section =>
        section.classList.remove("active")
    );

  const section =
    document.getElementById(id);

  if(section){

    section.classList.add("active");

  }

  document
    .querySelectorAll("nav button")
    .forEach(
      btn =>
        btn.classList.remove("active")
    );

  if(button){

    button.classList.add("active");

  }

  renderSection(id);

}


function renderSection(id){

  if(id === "dashboard")
    renderDashboard();

  if(id === "products")
    renderProducts();

  if(id === "orders")
    renderOrders();

  if(id === "inventory")
    renderInventory();

  if(id === "khata")
    renderKhata();

  if(id === "partners")
    renderPartners();

}


/* ================================
   DASHBOARD
================================ */

async function renderDashboard(){

  const dashboard =
    document.getElementById("dashboard");

  dashboard.innerHTML = `
    <h2>Dashboard</h2>

    <div class="notice">
      Payment gateway is intentionally disabled.
      RuralBiz records
      <b>paid / due / balance</b>
      only.
    </div>

    <div class="grid">

      <div class="card">
        <div class="muted">Account</div>
        <div class="stat">
          ${escapeHtml(currentUser.name)}
        </div>
      </div>

      <div class="card">
        <div class="muted">Role</div>
        <div class="stat">
          ${currentUser.role}
        </div>
      </div>

      <div class="card">
        <div class="muted">Database</div>
        <div class="stat green">
          Connected
        </div>
      </div>

      <div class="card">
        <div class="muted">API</div>
        <div class="stat green">
          Online
        </div>
      </div>

    </div>

    <div class="card" style="margin-top:14px">

      <h3>Quick Actions</h3>

      <div class="row wrap gap">

        ${
          currentUser.role === "retailer"
          ?
          `<button
             class="btn primary"
             onclick="goTo('products')">
             Browse Products
           </button>`
          :
          ""
        }

        ${
          ["wholesaler","supplier"].includes(
            currentUser.role
          )
          ?
          `<button
             class="btn primary"
             onclick="goTo('inventory')">
             Manage Inventory
           </button>`
          :
          ""
        }

        ${
          ["retailer","wholesaler"].includes(
            currentUser.role
          )
          ?
          `<button
             class="btn secondary"
             onclick="goTo('orders')">
             View Orders
           </button>`
          :
          ""
        }

      </div>

    </div>
  `;

}


function goTo(id){

  const button =
    [...document.querySelectorAll("nav button")]
      .find(
        b =>
          b.textContent
            .toLowerCase()
            .includes(id)
      );

  showSection(id,button);

}


/* ================================
   PRODUCTS
================================ */

async function loadProducts(){

  productsData =
    await api("/api/products");

  return productsData;

}


async function renderProducts(){

  const section =
    document.getElementById("products");

  section.innerHTML = `
    <h2>Products</h2>

    <div class="notice">
      Products are loaded from the
      RuralBiz PostgreSQL database.
    </div>

    <div id="productsList"
         class="product-grid">
      <div class="empty">
        Loading products...
      </div>
    </div>

    <div class="card"
         style="margin-top:14px">

      <div class="row">
        <b>Cart Total</b>
        <b id="cartTotal">₹0</b>
      </div>

      ${
        currentUser.role === "retailer"
        ?
        `<button
           class="btn primary"
           style="margin-top:10px"
           onclick="placeOrder()">
           Place Order
         </button>`
        :
        ""
      }

    </div>
  `;

  try{

    await loadProducts();

    renderProductCards();

  }catch(error){

    document.getElementById(
      "productsList"
    ).innerHTML =
      `<div class="empty red">
        ${escapeHtml(error.message)}
       </div>`;

  }

}


function renderProductCards(){

  const container =
    document.getElementById("productsList");

  if(!container) return;

  if(!productsData.length){

    container.innerHTML =
      `<div class="empty">
        No products available.
       </div>`;

    return;

  }

  container.innerHTML =
    productsData.map(product=>{

      const qty =
        cart[product.id] || 0;

      return `
        <div class="card product">

          <span class="tag ${
            Number(product.stock) <= 0
            ? "red"
            : Number(product.stock) < 10
            ? "yellow"
            : "green"
          }">

            ${
              Number(product.stock) <= 0
              ? "Out of stock"
              : "Stock: " + product.stock
            }

          </span>

          <h3>
            ${escapeHtml(product.name)}
          </h3>

          <div class="muted">
            SKU:
            ${escapeHtml(product.sku || "-")}
          </div>

          <div class="muted">
            Unit:
            ${escapeHtml(product.unit)}
          </div>

          <div class="price">
            ${money(product.price)}
          </div>

          ${
            currentUser.role === "retailer"
            ?
            `
            <div class="qty"
                 style="margin-top:12px">

              <button
                onclick="changeCart('${product.id}',-1)">
                −
              </button>

              <b>${qty}</b>

              <button
                onclick="changeCart('${product.id}',1)">
                +
              </button>

            </div>
            `
            :
            ""
          }

        </div>
      `;

    }).join("");

  updateCartTotal();

}


function changeCart(id,change){

  const product =
    productsData.find(
      p => p.id === id
    );

  if(!product) return;

  const old =
    cart[id] || 0;

  const next =
    Math.max(
      0,
      Math.min(
        Number(product.stock),
        old + change
      )
    );

  cart[id] = next;

  renderProductCards();

}


function updateCartTotal(){

  const total =
    Object.entries(cart)
      .reduce(
        (sum,[id,qty])=>{

          const product =
            productsData.find(
              p => p.id === id
            );

          return sum +
            (
              Number(product?.price || 0) *
              Number(qty)
            );

        },
        0
      );

  const element =
    document.getElementById("cartTotal");

  if(element){

    element.textContent =
      money(total);

  }

}


function cartTotal(){

  return Object.entries(cart)
    .reduce(
      (sum,[id,qty])=>{

        const product =
          productsData.find(
            p => p.id === id
          );

        return sum +
          Number(product?.price || 0) *
          Number(qty);

      },
      0
    );

}


/* ================================
   PLACE ORDER
================================ */

async function placeOrder(){

  const items =
    Object.entries(cart)
      .filter(
        ([_,quantity]) =>
          Number(quantity) > 0
      )
      .map(
        ([productId,quantity])=>({
          productId,
          quantity:Number(quantity)
        })
      );

  if(!items.length){

    alert("Cart is empty.");

    return;

  }

  const wholesalerId =
    prompt(
      "Enter Wholesaler ID"
    );

  if(!wholesalerId){

    return;

  }

  try{

    const order =
      await api(
        "/api/orders",
        {
          method:"POST",
          body:JSON.stringify({
            wholesalerId,
            items
          })
        }
      );

    cart = {};

    alert(
      "Order placed successfully.\n\nOrder ID:\n" +
      order.id
    );

    goTo("orders");

  }catch(error){

    alert(
      "Order failed:\n" +
      error.message
    );

  }

}


/* ================================
   ORDERS
================================ */

async function renderOrders(){

  const section =
    document.getElementById("orders");

  section.innerHTML = `
    <h2>Orders</h2>

    <div class="card table-wrap">

      <table>

        <thead>
          <tr>
            <th>Order ID</th>
            <th>Total</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="ordersBody">
          <tr>
            <td colspan="4"
                class="empty">
              Loading...
            </td>
          </tr>
        </tbody>

      </table>

    </div>
  `;

  try{

    ordersData =
      await api("/api/orders");

    const body =
      document.getElementById(
        "ordersBody"
      );

    if(!ordersData.length){

      body.innerHTML =
        `<tr>
          <td colspan="4"
              class="empty">
            No orders yet
          </td>
        </tr>`;

      return;

    }

    body.innerHTML =
      ordersData.map(order=>`

        <tr>

          <td>
            <b>
              ${escapeHtml(order.id)}
            </b>
            <br>
            <span class="muted">
              ${escapeHtml(
                order.created_at || ""
              )}
            </span>
          </td>

          <td>
            ${money(order.total)}
          </td>

          <td>
            <span class="tag ${
              order.status === "confirmed"
              ? "green"
              : order.status === "rejected"
              ? "red"
              : "yellow"
            }">
              ${escapeHtml(order.status)}
            </span>
          </td>

          <td>

            ${
              currentUser.role === "wholesaler" &&
              order.status === "pending"
              ?
              `<button
                 class="btn success"
                 onclick="confirmOrder('${order.id}')">
                 Confirm
               </button>`
              :
              ""
            }

          </td>

        </tr>

      `).join("");

  }catch(error){

    document.getElementById(
      "ordersBody"
    ).innerHTML =
      `<tr>
        <td colspan="4"
            class="empty red">
          ${escapeHtml(error.message)}
        </td>
      </tr>`;

  }

}


async function confirmOrder(id){

  if(!confirm(
    "Confirm this order?\nStock will be reduced automatically."
  )){

    return;

  }

  try{

    await api(
      "/api/orders/" + id + "/confirm",
      {
        method:"POST"
      }
    );

    alert(
      "Order confirmed.\nInventory updated automatically."
    );

    renderOrders();

  }catch(error){

    alert(
      "Confirmation failed:\n" +
      error.message
    );

  }

}

function openProductForm(){

  openModal(`

    <h3>Add Product</h3>

    <div class="form">

      <input
        id="productName"
        placeholder="Product name">

      <input
        id="productSku"
        placeholder="SKU">

      <input
        id="productUnit"
        placeholder="Unit"
        value="piece">

      <input
        id="productPrice"
        type="number"
        placeholder="Price">

      <input
        id="productStock"
        type="number"
        placeholder="Opening stock">

      <button
        class="btn primary"
        onclick="addProduct()">
        Save Product
      </button>

      <button
        class="btn secondary"
        onclick="closeModal()">
        Cancel
      </button>

    </div>

  `);

}


async function addProduct(){

  const name =
    document.getElementById(
      "productName"
    ).value.trim();

  const sku =
    document.getElementById(
      "productSku"
    ).value.trim();

  const unit =
    document.getElementById(
      "productUnit"
    ).value.trim() || "piece";

  const price =
    Number(
      document.getElementById(
        "productPrice"
      ).value
    );

  const stock =
    Number(
      document.getElementById(
        "productStock"
      ).value
    );

  if(!name){

    alert("Product name required.");

    return;

  }

  try{

    await api(
      "/api/products",
      {
        method:"POST",
        body:JSON.stringify({
          name,
          sku,
          unit,
          price,
          stock
        })
      }
    );

    closeModal();

    alert(
      "Product added successfully."
    );

    renderInventory();

  }catch(error){

    alert(
      "Product creation failed:\n" +
      error.message
    );

  }

}


/* ================================
   STOCK
================================ */

async function stockUpdate(
  productId,
  direction
){

  const amount =
    Number(
      prompt(
        direction > 0
        ? "How much stock to add?"
        : "How much stock to remove?"
      )
    );

  if(!amount || amount <= 0){

    return;

  }

  const quantity =
    direction > 0
    ? amount
    : -amount;

  try{

    await api(
      "/api/products/" +
      productId +
      "/stock",
      {
        method:"PATCH",
        body:JSON.stringify({
          quantity
        })
      }
    );

    alert(
      "Inventory updated successfully."
    );

    renderInventory();

  }catch(error){

    alert(
      "Stock update failed:\n" +
      error.message
    );

  }

}
